<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标签页定时刷新</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand" data-i18n="extName"></div>
    <div class="header-right">
      <span id="globalStatus" class="status"></span>
      <button id="pauseAllBtn" class="mini"></button>
    </div>
  </header>

  <section class="card">
    <div class="tab-line">
      <img id="tabFavicon" alt="">
      <div class="tab-meta">
        <div id="tabTitle" class="tab-title"></div>
        <div id="tabUrl" class="tab-url"></div>
      </div>
    </div>
    <div id="restrictHint" class="hint warn" hidden data-i18n="restrictHint"></div>
    <div class="row">
      <span class="label" data-i18n="intervalLabel"></span>
      <select id="presetSelect"></select>
      <input id="customInput" type="number" min="30" step="1" data-i18n-placeholder="customPlaceholder">
    </div>
    <label class="row-check">
      <input id="bypassCheck" type="checkbox">
      <span data-i18n="bypassLabel"></span>
    </label>
    <label class="row-check">
      <input id="skipDiscardedCheck" type="checkbox">
      <span data-i18n="skipDiscardedLabel"></span>
    </label>
    <button id="toggleBtn" class="primary"></button>
    <div id="msg" class="hint"></div>
  </section>

  <section class="card">
    <div class="list-head">
      <span class="list-title" data-i18n="listTitle"></span>
      <span id="taskCount" class="count"></span>
    </div>
    <ul id="taskList"></ul>
    <div id="emptyHint" class="hint" hidden data-i18n="emptyHint"></div>
  </section>

  <footer id="repoFooter">
    <a href="https://github.com/yrgpcn/tab-auto-refresh" target="_blank" rel="noopener">github.com/yrgpcn/tab-auto-refresh</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
