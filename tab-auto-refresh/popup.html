<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标签页定时刷新</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand" data-i18n="extName"></div>
    <div class="header-right">
      <span id="globalStatus" class="status"></span>
      <button id="pauseAllBtn" class="mini"></button>
    </div>
  </header>

  <section class="card card-fixed">
    <div class="tab-line">
      <img id="tabFavicon" alt="">
      <div class="tab-meta">
        <div id="tabTitle" class="tab-title"></div>
        <div id="tabUrl" class="tab-url"></div>
      </div>
    </div>
    <div id="restrictHint" class="hint warn" hidden data-i18n="restrictHint"></div>
    <div class="row">
      <span class="label" data-i18n="intervalLabel"></span>
      <select id="presetSelect"></select>
      <input id="customInput" type="number" min="30" step="1" data-i18n-placeholder="customPlaceholder">
    </div>
    <div class="row">
      <span class="label" data-i18n="keywordLabel"></span>
      <input id="keywordInput" type="text" data-i18n-placeholder="keywordPlaceholder">
    </div>
    <div class="check-grid">
      <label class="row-check" data-i18n-title="keepWatchingHint">
        <input id="keepWatchingCheck" type="checkbox">
        <span data-i18n="keepWatchingLabel"></span>
      </label>
      <label class="row-check">
        <input id="bypassCheck" type="checkbox">
        <span data-i18n="bypassLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="skipDiscardedHint">
        <input id="skipDiscardedCheck" type="checkbox">
        <span data-i18n="skipDiscardedLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="cookieBackupHint">
        <input id="cookieBackupCheck" type="checkbox">
        <span data-i18n="cookieBackupLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="keepAliveHint">
        <input id="keepAliveCheck" type="checkbox">
        <span data-i18n="keepAliveLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="httpHeartbeatHint">
        <input id="httpHeartbeatCheck" type="checkbox">
        <span data-i18n="httpHeartbeatLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="skipOnActivityHint">
        <input id="skipOnActivityCheck" type="checkbox">
        <span data-i18n="skipOnActivityLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="keepAwakeHint">
        <input id="keepAwakeCheck" type="checkbox">
        <span data-i18n="keepAwakeLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="captchaGuardHint">
        <input id="captchaGuardCheck" type="checkbox">
        <span data-i18n="captchaGuardLabel"></span>
      </label>
      <label class="row-check" data-i18n-title="wechatHint">
        <input id="wechatEnabledCheck" type="checkbox">
        <span data-i18n="wechatLabel"></span>
      </label>
    </div>
    <!-- 微信直连：开启后才显示这一行（配置入口 + 最近一次推送结果）。
         平时不占高度：设置卡片已经贴着 600px 上限，多一行就从任务列表里扣 -->
    <div id="wechatRow" class="row wx-row" hidden>
      <button id="wechatSetupBtn" class="mini" type="button" data-i18n="wechatSetup"></button>
      <span id="wechatState" class="wx-state"></span>
    </div>
    <div class="row">
      <span class="label" data-i18n="webhookLabel"></span>
      <input id="webhookUrlInput" type="text" data-i18n-placeholder="webhookPlaceholder" data-i18n-title="webhookHint">
    </div>
    <div id="webhookInvalid" class="hint error" hidden data-i18n="webhookInvalid"></div>
    <div class="row webhook-events">
      <label class="row-check compact">
        <input id="webhookEvSession" type="checkbox">
        <span data-i18n="webhookEvSession"></span>
      </label>
      <label class="row-check compact">
        <input id="webhookEvKeyword" type="checkbox">
        <span data-i18n="webhookEvKeyword"></span>
      </label>
      <label class="row-check compact">
        <input id="webhookEvStopped" type="checkbox">
        <span data-i18n="webhookEvStopped"></span>
      </label>
      <label class="row-check compact">
        <input id="webhookEvPaused" type="checkbox">
        <span data-i18n="webhookEvPaused"></span>
      </label>
    </div>
    <button id="toggleBtn" class="primary"></button>
    <div id="msg" class="hint"></div>
  </section>

  <section class="card card-tasks">
    <div class="list-head">
      <span class="list-title" data-i18n="listTitle"></span>
      <span id="taskCount" class="count"></span>
    </div>
    <ul id="taskList"></ul>
    <div id="emptyHint" class="hint" hidden data-i18n="emptyHint"></div>
  </section>

  <footer id="repoFooter">
    <a href="https://github.com/yrgpcn/tab-auto-refresh" target="_blank" rel="noopener">github.com/yrgpcn/tab-auto-refresh</a>
  </footer>

  <!-- 微信配置走二级视图：四行输入框直接铺在主视图里必然顶破 600px 上限
       （设置卡片一张已经贴着上限，任务列表全靠 flex 让位）。切换由 body.wx-mode 控制 -->
  <div id="wechatView">
    <header class="wx-head">
      <button id="wechatBackBtn" class="mini" type="button" data-i18n="wechatBack"></button>
      <span class="wx-title" data-i18n="wechatViewTitle"></span>
    </header>
    <section class="card card-fixed">
      <div class="wx-intro" data-i18n="wechatIntro"></div>
      <a id="wechatGuideLink" class="wx-guide" href="wechat-setup.html" target="_blank" rel="noopener"
         data-i18n="wechatGuideLink" data-i18n-title="wechatGuideHint"></a>
      <div class="row">
        <span class="label" data-i18n="wechatAppIdLabel"></span>
        <input id="wechatAppIdInput" type="text" data-i18n-placeholder="wechatAppIdPlaceholder">
      </div>
      <div class="row">
        <span class="label" data-i18n="wechatSecretLabel"></span>
        <input id="wechatSecretInput" type="text" data-i18n-placeholder="wechatSecretPlaceholder" data-i18n-title="wechatSecretHint">
      </div>
      <div class="row">
        <span class="label" data-i18n="wechatOpenIdLabel"></span>
        <input id="wechatOpenIdInput" type="text" data-i18n-placeholder="wechatOpenIdPlaceholder">
      </div>
      <div class="row">
        <span class="label" data-i18n="wechatTplLabel"></span>
        <input id="wechatTplInput" type="text" data-i18n-placeholder="wechatTplPlaceholder" data-i18n-title="wechatTplHint">
      </div>
      <div class="wx-tpl-hint" data-i18n="wechatTplBody"></div>
      <button id="wechatTestBtn" class="mini wx-test" type="button" data-i18n="wechatTestBtn"></button>
      <div id="wechatViewState" class="hint"></div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
