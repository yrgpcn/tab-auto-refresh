name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate manifests, locales and JS syntax
        run: node scripts/validate.mjs

      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
